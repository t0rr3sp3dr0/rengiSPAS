name: Test
on:
  push: {}
jobs:
  emu:
    name: Emulation
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            deps: make ./include/unicorn/unicorn.h ./lib/libunicorn.a
          - os: macos-14
            deps: brew install 'unicorn'
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.deps }}
      - run: make 'sapsigner-emu.out'
      - run: make 'test(./sapsigner-emu.out)'
